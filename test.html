<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 最終版（ログ強化）</title>
    <style>
        body {
            transition: background-color 0.4s ease;
            padding: 30px;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            background-color: #f5f5f5;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .highlight {
            border: 3px solid #ffd700 !important;
            background-color: #fffdf0;
        }
        #display-area {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            min-height: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #fafafa;
            word-wrap: break-word;
        }
        .btn-delete {
            background-color: #ff4d4f;
            color: white;
            border: none;
            width: 70px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
        }
        .cell-action {
            width: 80px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>テキスト管理パネル</h2>
    <div style="margin-bottom: 15px;">
        <input type="text" id="text-input" placeholder="テキストを入力...">
        <button id="show-btn">表示</button>
        <button id="change-bg-btn">背景色を変更</button>
    </div>
    <p>現在の件数: <span id="counter" style="font-weight: bold;">0</span> / 3</p>
    <div id="display-area">
        <table id="text-table">
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const showBtn = document.getElementById('show-btn');
    const changeBgBtn = document.getElementById('change-bg-btn');
    const displayArea = document.getElementById('display-area');
    const tableBody = document.getElementById('table-body');
    const counterSpan = document.getElementById('counter');

    const colors = ['lightblue', 'lightgreen', 'lightcoral'];
    let colorIndex = 0;

    // --- ログ用変数 ---
    let totalActionCount = 0; // すべての操作（追加・削除）の通算

    // --- メイン：表示ボタンクリック ---
    showBtn.addEventListener('click', () => {
        const val = textInput.value.trim();

        if (val === "") {
            alert("入力値が空です。");
            return;
        }

        displayArea.classList.toggle('highlight');

        // 最大3件の押し出し制御
        if (tableBody.rows.length >= 3) {
            tableBody.deleteRow(0);
            console.log("%c[System] 最大件数に達したため、古いデータを押し出しました。", "color: orange;");
        }

        totalActionCount++;
        console.log(`%c▶ 操作回数: ${totalActionCount} | 追加: "${val}"`, "color: blue; font-weight: bold;");

        addRow(val);
        updateUI();
        textInput.value = "";
    });

    // --- 行追加関数 ---
    function addRow(text) {
        const row = tableBody.insertRow(-1);
        const cellText = row.insertCell(0);
        const cellBtn = row.insertCell(1);
        
        cellBtn.className = 'cell-action';
        cellText.textContent = text;
        
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.className = 'btn-delete';
        
        delBtn.onclick = () => {
            totalActionCount++;
            row.remove();
            
            const currentCount = tableBody.rows.length;
            console.log(`%c◀ 操作回数: ${totalActionCount} | 削除を実行しました。`, "color: red; font-weight: bold;");
            
            if (currentCount < 3) {
                console.log(`%c[Info] 件数が ${currentCount} 件になったため、表示ボタンが再出現しました。`, "color: green;");
            }
            
            updateUI();
        };
        cellBtn.appendChild(delBtn);
    }

    // --- UI更新関数 ---
    function updateUI() {
        const count = tableBody.rows.length;
        counterSpan.textContent = count;

        if (count >= 3) {
            showBtn.style.display = 'none';
            console.log("%c[Status] リストが満杯です。ボタンを非表示にします。", "background: #eee; color: #333;");
        } else {
            showBtn.style.display = 'inline-block';
        }
    }

    // --- 背景変更 ---
    changeBgBtn.addEventListener('click', () => {
        document.body.style.backgroundColor = colors[colorIndex];
        colorIndex = (colorIndex + 1) % colors.length;
    });
</script>

</body>
</html>
