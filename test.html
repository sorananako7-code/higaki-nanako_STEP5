<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 演習（完成版）</title>
    <style>
        body {
            transition: background-color 0.4s;
            padding: 30px;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .highlight {
            border: 3px solid orange !important;
            background-color: #fffbe6;
        }
        #display-area {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-height: 120px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* テーブルの幅を固定 */
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #eee;
            word-wrap: break-word; /* 長いテキストの改行対策 */
        }
        /* --- 削除ボタンの固定スタイル --- */
        .btn-delete {
            background-color: #ff4d4f;
            color: white;
            border: none;
            width: 70px;      /* 幅を固定 */
            height: 32px;     /* 高さを固定 */
            line-height: 32px; /* テキストの垂直中央揃え */
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;       /* パディングによる変動を防ぐ */
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn-delete:hover {
            opacity: 0.8;
        }
        /* ボタンが入るセルを右寄せ & 幅指定 */
        .cell-action {
            width: 80px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>テキスト管理パネル</h2>

    <input type="text" id="text-input" placeholder="テキストを入力">
    <button id="show-btn">表示</button>
    <button id="change-bg-btn">背景色を変更</button>

    <p>現在の件数: <span id="counter">0</span> / 3</p>

    <div id="display-area">
        <table id="text-table">
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const showBtn = document.getElementById('show-btn');
    const changeBgBtn = document.getElementById('change-bg-btn');
    const displayArea = document.getElementById('display-area');
    const tableBody = document.getElementById('table-body');
    const counterSpan = document.getElementById('counter');

    const colors = ['lightblue', 'lightgreen', 'lightcoral'];
    let colorIndex = 0;
    let loopCount = 0;

    showBtn.addEventListener('click', () => {
        const val = textInput.value.trim();
        if (val === "") {
            alert("入力値が空です。");
            return;
        }

        displayArea.classList.toggle('highlight');

        if (tableBody.rows.length >= 3) {
            tableBody.deleteRow(0);
        }

        loopCount++;
        console.log(`操作ログ: ${loopCount} 回目の入力 (値: "${val}")`);

        addRow(val);
        updateState();
        textInput.value = "";
    });

    function addRow(text) {
        const row = tableBody.insertRow(-1);
        const cellText = row.insertCell(0);
        const cellBtn = row.insertCell(1);
        
        cellBtn.className = 'cell-action'; // ボタン用セルにクラス適用

        cellText.textContent = text;
        
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.className = 'btn-delete';
        delBtn.onclick = () => {
            row.remove();
            console.log(`操作ログ: 1件削除。残件数: ${tableBody.rows.length}`);
            updateState();
        };
        cellBtn.appendChild(delBtn);
    }

    function updateState() {
        const currentCount = tableBody.rows.length;
        counterSpan.textContent = currentCount;
        showBtn.style.visibility = 'visible'; 
    }

    changeBgBtn.addEventListener('click', () => {
        document.body.style.backgroundColor = colors[colorIndex];
        colorIndex = (colorIndex + 1) % colors.length;
    });
</script>

</body>
</html>
