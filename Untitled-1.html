<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JavaScript </title>
    <style>
        body {
            transition: background-color 0.4s ease;
            padding: 30px;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            background-color: #f5f5f5;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .highlight {
            border: 3px solid #ffd700 !important;
            background-color: #fffdf0;
        }
        #display-area {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            min-height: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #fafafa;
            word-wrap: break-word;
        }
        .btn-delete {
            background-color: #ff4d4f;
            color: white;
            border: none;
            width: 70px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
        }
        .cell-action {
            width: 80px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>テキスト管理パネル</h2>
    <div style="margin-bottom: 15px;">
        <input type="text" id="text-input" placeholder="テキストを入力...">
        <button id="show-btn">表示</button>
        <button id="change-bg-btn">背景色を変更</button>
    </div>
    <p>現在の件数: <span id="counter" style="font-weight: bold;">0</span> / 3</p>
    <div id="display-area">
        <table id="text-table">
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
console.log("--- 設問7: ループ開始 ---");
for (let i = 1; i <= 5; i++) {
    console.log("ループ回数: " + i);
}

const textInput = document.getElementById('text-input');
    const showBtn = document.getElementById('show-btn');
    const changeBgBtn = document.getElementById('change-bg-btn');
    const displayArea = document.getElementById('display-area');
    const tableBody = document.getElementById('table-body');
    const counterSpan = document.getElementById('counter');

    const colors = ['lightblue', 'lightgreen', 'lightcoral'];
    let colorIndex = 0;

    showBtn.addEventListener('click', () => {
        const val = textInput.value.trim();

        if (val === "") {
            alert("入力値が空です。");
            return;
        }

        displayArea.classList.toggle('highlight');

        addRow(val);
        updateUI();
        
        debugLoop();

        textInput.value = "";
    });

    function addRow(text) {
        const row = tableBody.insertRow(-1);
        const cellText = row.insertCell(0);
        const cellBtn = row.insertCell(1);
        
        cellBtn.className = 'cell-action';
        cellText.textContent = text;
        
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.className = 'btn-delete';
        
        delBtn.onclick = () => {
            row.remove();
            updateUI();
            
            console.log("削除を実行しました。");
            debugLoop();
        };
        cellBtn.appendChild(delBtn);
    }

    function updateUI() {
        const count = tableBody.rows.length;
        counterSpan.textContent = count;

        if (count >= 3) {
            showBtn.style.display = 'none';
        } else {
            showBtn.style.display = 'inline-block';
        }
    }

    changeBgBtn.addEventListener('click', () => {
        document.body.style.backgroundColor = colors[colorIndex];
        colorIndex = (colorIndex + 1) % colors.length;
    });
</script>

</body>
</html>
